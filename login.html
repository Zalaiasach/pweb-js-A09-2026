<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - My Store Gweh</title>
  <link rel="stylesheet" href="login.css">
  <script src="login.js" defer></script>
</head>
<body>
  <div class="login-card">
    <div class="header">
      <h2>Masuk ke akunmu</h2>
      <p>Gunakan username & password akunmu.</p>
    </div>

    <div id="alertBox" class="alert-box hidden"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Masukan username" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Masukan Password" required autocomplete="current-password">
      </div>

      <button type="submit" id="btnLogin" class="btn-primary">
        <span class="btn-text">Masuk</span>
        <span class="loader hidden"></span>
      </button>
    </form>
  </div>
</body>
</html>
